# Проверки на каждый push и pull request: тесты бэкенда на PostgreSQL,
# проверка типов и сборка фронтенда, сборка обоих Docker-образов.
# Линтеры: ruff для бэкенда, ESLint для фронтенда (tasks/00-skeleton.md,
# итерация 2). Тесты — штатным раннером Django, без pytest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Бэкенд — линтер и тесты
    runs-on: ubuntu-latest
    services:
      # Тесты идут на той же СУБД, что и в работе: SQLite прощает то,
      # на чём PostgreSQL падает (типы, блокировки, ограничения).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vacation
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vacation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vacation:vacation@localhost:5432/vacation
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"   # как в backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check --output-format=github .
      - name: Нет несозданных миграций
        run: python manage.py makemigrations --check --dry-run
      - name: Тесты
        run: python manage.py test --noinput
      # Настройки безопасности в production-окружении. Значения — как на
      # площадке, но не настоящие. Исключения (docs/20-deploy-cloud.md):
      # W008 — на HTTPS перенаправляет балансировщик; W005, W021 — HSTS
      # на поддомены и preload-список включаются только осознанно.
      - name: manage.py check --deploy
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: vacation.example.com
          DATABASE_URL: postgres://u:p@db.example.com/vacation?sslmode=verify-full
          EMAIL_HOST: smtp.example.com
          SECURE_HSTS_SECONDS: "31536000"
          SILENCED_SYSTEM_CHECKS: security.W005,security.W008,security.W021
        run: |
          SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(60))")
          export SECRET_KEY
          python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Фронтенд — линтер, типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"   # как в frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Линтер (ESLint)
        run: npm run lint
      - run: npx tsc -b
      - run: npm run build

  images:
    name: Docker-образы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Сборка образа бэкенда сама прогоняет manage.py check и collectstatic:
      # ошибка импорта ломает CI, а не запуск на площадке.
      - name: Образ бэкенда
        run: |
          docker build -t vacation-backend:ci backend
          # .dockerignore: ни тестов, ни локальных баз и .env в каталоге приложения
          found=$(docker run --rm --entrypoint sh vacation-backend:ci -c \
            'find /app \( -name "tests.py" -o -name "tests_*.py" -o -name "*.sqlite3" -o -name ".env*" -o -name "*.dump" \)')
          if [ -n "$found" ]; then echo "Лишнее в образе:"; echo "$found"; exit 1; fi
      - name: Образ бэкенда с Kerberos
        run: |
          docker build --build-arg WITH_KERBEROS=1 -t vacation-backend:krb backend
          docker run --rm --entrypoint python vacation-backend:krb -c "import gssapi; print('gssapi', gssapi.__name__)"
      - name: Образ фронтенда
        run: docker build -t vacation-frontend:ci frontend
      - name: Образ резервного копирования
        run: |
          docker build -t vacation-backup:ci deploy/backup
          docker run --rm --entrypoint sh vacation-backup:ci -c 'age --version && aws --version && pg_dump --version'
      # Уязвимости в образах: CI падает на CRITICAL и HIGH, для которых уже
      # есть исправление (--ignore-unfixed): без исправления сделать нечего,
      # а красный CI на них только приучил бы его игнорировать.
      - name: Trivy — уязвимости образов
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | tar xz trivy
          # Оба образа проверяются до конца, чтобы в журнале были все находки.
          status=0
          for image in vacation-backend:ci vacation-frontend:ci vacation-backup:ci; do
            ./trivy image --quiet --scanners vuln --ignore-unfixed \
              --severity CRITICAL,HIGH --exit-code 1 "$image" || status=1
          done
          exit $status
      # Перечень всего, что входит в образы (SBOM, SPDX): при новой
      # уязвимости по нему видно, затронута ли выпущенная версия.
      - name: SBOM образов
        run: |
          curl -fsSL https://github.com/anchore/syft/releases/download/v1.56.0/syft_1.56.0_linux_amd64.tar.gz | tar xz syft
          mkdir -p sbom
          ./syft vacation-backend:ci -o spdx-json=sbom/backend.spdx.json
          ./syft vacation-frontend:ci -o spdx-json=sbom/frontend.spdx.json
          ./syft vacation-backup:ci -o spdx-json=sbom/backup.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/
      # Тот же путь, что у пользователей: compose поднимает базу, бэкенд
      # с миграциями и фронтенд с прокси; проверяем API через nginx.
      - name: Запуск через docker compose
        run: |
          SECRET_KEY=ci-compose-$(date +%s)-not-secret
          export SECRET_KEY
          docker compose up -d --wait postgres backend frontend
          curl -fsS http://localhost:8080/api/health/
          curl -fsS http://localhost:8080/api/health/live/
          curl -fsS http://localhost:8080/api/health/ready/
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # Заголовки безопасности nginx: на странице, на API и на ошибке.
          for path in / /api/health/ /admin/login/; do
            h=$(curl -s -D - -o /dev/null "http://localhost:8080$path")
            for name in Content-Security-Policy X-Content-Type-Options X-Frame-Options \
                        Referrer-Policy Permissions-Policy Strict-Transport-Security; do
              echo "$h" | grep -qi "^$name:" || { echo "нет $name на $path"; exit 1; }
            done
            echo "$h" | grep -qi '^Server: nginx/' && { echo "версия nginx видна на $path"; exit 1; }
            test "$(echo "$h" | grep -ci '^X-Frame-Options:')" = 1 || { echo "X-Frame-Options дважды на $path"; exit 1; }
          done
          curl -sI http://localhost:8080/ | grep -qi '^Cache-Control: no-cache'
          # Токены из адреса и Referer не попадают в журналы nginx и gunicorn.
          curl -s -o /dev/null "http://localhost:8080/?invite=CI-SECRET-INVITE"
          curl -s -o /dev/null -H "Referer: http://localhost:8080/?invite=CI-SECRET-REF" \
            "http://localhost:8080/api/v1/auth/oidc/callback/?code=CI-SECRET-CODE&state=x"
          sleep 1
          if docker compose logs frontend backend | grep -q CI-SECRET; then
            echo "Токен попал в журнал:"; docker compose logs frontend backend | grep CI-SECRET; exit 1
          fi
          # Контейнер фронтенда работает не от root.
          test "$(docker compose exec -T frontend id -u)" != 0
          # Админка через nginx: без списка адресов закрыта, со списком —
          # страница входа Django, а не SPA.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/login/)" = 403
          ADMIN_ALLOW_CIDRS=0.0.0.0/0 docker compose up -d --wait frontend
          curl -fsS http://localhost:8080/admin/login/ | grep -q csrfmiddlewaretoken
      # Интерфейс в настоящем браузере: экран входа отрисован, в консоли
      # нет ошибок (в том числе нарушений CSP).
      - name: Браузерная проверка интерфейса
        run: |
          mkdir -p /tmp/ui && cd /tmp/ui && npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.65.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/deploy/ci/smoke-ui.mjs" .
          node smoke-ui.mjs http://localhost:8080
      # Резервная копия на настоящей базе: зашифрованный дамп должен
      # расшифровываться закрытым ключом и читаться pg_restore.
      - name: Резервная копия с шифрованием и восстановление
        run: |
          docker run --rm --entrypoint age-keygen vacation-backup:ci > /tmp/age.key 2>/dev/null
          pub=$(grep -o 'age1[a-z0-9]*' /tmp/age.key)
          mkdir -p backups && chmod 777 backups
          docker compose run --rm -e BACKUP_ONCE=1 -e BACKUP_AGE_RECIPIENTS="$pub" backup
          ls -l backups
          file=$(ls backups/*.dump.age)
          docker run --rm -v "$PWD/backups:/b:ro" -v /tmp/age.key:/k:ro --entrypoint sh vacation-backup:ci \
            -c "age -d -i /k '/b/$(basename "$file")' | pg_restore --list" | grep -q 'TABLE public employees_employee'
          # Без ключа при обязательном шифровании — отказ, а не открытая копия.
          if docker compose run --rm -e BACKUP_ONCE=1 -e BACKUP_REQUIRE_ENCRYPTION=1 backup; then
            echo "копия без шифрования при BACKUP_REQUIRE_ENCRYPTION=1"; exit 1
          fi
      # Корневая ФС только для чтения, как в deploy/k8s: если приложению
      # понадобится писать куда-то ещё, это всплывёт здесь, а не в кластере.
      - name: Запуск с файловой системой только для чтения
        run: |
          SECRET_KEY=ci-compose-$(date +%s)-not-secret
          export SECRET_KEY
          docker compose -f docker-compose.yml -f deploy/ci/compose.readonly.yml up -d --wait --force-recreate backend frontend
          curl -fsS http://localhost:8080/api/health/ready/
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # Демо-режим включён: его база SQLite тоже должна жить во временном каталоге.
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"role":"employee"}' \
            http://localhost:8080/api/v1/auth/demo-login/ | grep -q token
          if docker compose exec -T backend touch /app/x 2>/dev/null; then
            echo "Корневая ФС бэкенда доступна на запись"; exit 1
          fi
      - name: Журналы при сбое
        if: failure()
        run: docker compose logs --no-color

  # Уязвимые зависимости и секреты в коде.
  security:
    name: Безопасность — зависимости и секреты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # gitleaks проверяет всю историю, а не последний коммит
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Исключения — только с обоснованием (docs/20-deploy-cloud.md, раздел 6):
      # PYSEC-2025-183 (pyjwt) оспорен поставщиком, исправления нет; длину
      # ключа выбирает приложение, у нас ключи RS256 от Keycloak.
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2025-183
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Только то, что попадает в бандл: инструменты сборки до пользователя
      # не доходят.
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks — секреты в истории
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  # Синтаксис и выражения workflow и скриптов выкатки: ошибка в deploy.yml
  # иначе всплыла бы только при выкатке.
  workflows:
    name: GitHub Actions — workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
      - name: shellcheck скриптов развёртывания
        run: shellcheck deploy/ci/*.sh frontend/docker-entrypoint.d/*.sh

  kubernetes:
    name: Kubernetes — манифесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Сборка kustomize и проверка по схемам Kubernetes
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kustomize build deploy/k8s > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 rendered.yaml deploy/k8s/secret.example.yaml
          sudo mv kustomize kubeconform /usr/local/bin/
      # Манифесты конвейера развёртывания: рендер с примерными значениями
      # площадки и логика выкатки/отката на заглушках kubectl.
      - name: Конвейер развёртывания
        run: |
          IMAGE_TAG=sha-ci BACKEND_IMAGE=registry.example.com/b FRONTEND_IMAGE=registry.example.com/f \
            BACKUP_IMAGE=registry.example.com/k \
            APP_DOMAIN=vacation.example.com INGRESS_CLASS=nginx \
            python3 deploy/ci/render.py /tmp/rendered
          kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/rendered/*.yaml deploy/k8s/pipeline/deployer-rbac.yaml
          deploy/ci/test_deploy.sh
