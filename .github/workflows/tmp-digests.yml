name: tmp-digests
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in python:3.12-slim node:22-alpine nginxinc/nginx-unprivileged:1.27-alpine postgres:16-alpine; do
            echo "DIGEST $i $(docker buildx imagetools inspect "$i" --format '{{json .Manifest.Digest}}')"
          done
