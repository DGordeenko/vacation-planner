apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: vacation, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: vacation, component: frontend }
  template:
    metadata:
      labels: { app: vacation, component: frontend }
    spec:
      containers:
        - name: frontend
          image: vacation-frontend
          ports:
            - containerPort: 8080
          env:
            - { name: PORT, value: "8080" }
            # Без пути и без «/» в конце (frontend/nginx.conf)
            - { name: BACKEND_URL, value: "http://backend:8000" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: vacation, component: frontend }
  ports:
    - port: 8080
      targetPort: 8080
