apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: vacation, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: vacation, component: frontend }
  template:
    metadata:
      labels: { app: vacation, component: frontend }
    spec:
      # Образ nginx-unprivileged: пользователь nginx, UID 101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: vacation-frontend
          ports:
            - containerPort: 8080
          env:
            - { name: PORT, value: "8080" }
            # Без пути и без «/» в конце (frontend/nginx/default.conf.template)
            - { name: BACKEND_URL, value: "http://backend:8000" }
            # Админка Django через nginx (docs/18-deploy-kubernetes.md).
            # Путь — тот же, что у бэкенда; пустой список адресов — 403 всем.
            - name: DJANGO_ADMIN_PATH
              valueFrom: { configMapKeyRef: { name: vacation-config, key: DJANGO_ADMIN_PATH } }
            - name: ADMIN_ALLOW_CIDRS
              valueFrom: { configMapKeyRef: { name: vacation-config, key: ADMIN_ALLOW_CIDRS } }
            - name: TRUSTED_PROXY_CIDRS
              valueFrom: { configMapKeyRef: { name: vacation-config, key: TRUSTED_PROXY_CIDRS } }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: vacation, component: frontend }
  ports:
    - port: 8080
      targetPort: 8080
