# Миграции — отдельным Job до обновления подов: несколько реплик, стартуя
# одновременно, конкурировали бы за миграции. Перед каждым обновлением образа:
#   kubectl -n vacation delete job migrate --ignore-not-found && kubectl apply -k deploy/k8s
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 2
  # Завершённые Job удаляются сами: конвейер создаёт свой на каждую версию.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }   # на диске: туда же демо-база SQLite
        - name: db-ca
          configMap: { name: vacation-db-ca, optional: true }
      containers:
        - name: migrate
          image: vacation-backend
          # Команда вместо веб-сервера (backend/entrypoint.sh): ensure_admin — после миграций.
          args: ["sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_admin"]
          envFrom:
            - configMapRef: { name: vacation-config }
            - secretRef: { name: vacation-secrets }
          # Корневой сертификат управляемой базы (DB_SSLROOTCERT=/app/certs/...).
          # ConfigMap необязателен: без него каталог просто пуст.
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: db-ca, mountPath: /app/certs, readOnly: true }
