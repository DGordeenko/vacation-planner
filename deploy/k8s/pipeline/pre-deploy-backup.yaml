# Резервная копия базы перед миграциями (конвейер .github/workflows/deploy.yml).
# Не входит в deploy/k8s/kustomization.yaml: создаётся конвейером на каждую
# версию с уникальным именем. Тот же образ и скрипт, что у ежедневного
# CronJob backup: pg_dump → шифрование age → S3-совместимое хранилище
# (AWS S3, Huawei OBS, Yandex Object Storage), каталог pre-deploy/.
# Без ключа age Job завершается ошибкой, и выкатка останавливается.
apiVersion: batch/v1
kind: Job
metadata:
  name: pre-deploy-backup
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
      volumes:
        - name: work
          emptyDir: { sizeLimit: 2Gi }
        - name: db-ca
          configMap: { name: vacation-db-ca, optional: true }
      containers:
        - name: backup
          image: vacation-backup
          env:
            - { name: BACKUP_ONCE, value: "1" }
            - { name: BACKUP_DIR, value: /work }
            - { name: BACKUP_REQUIRE_ENCRYPTION, value: "1" }
            - { name: BACKUP_S3_PREFIX, value: pre-deploy }
            - { name: BACKUP_NAME, value: IMAGE_TAG_VALUE }
            - { name: HOME, value: /work }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: vacation-secrets, key: DATABASE_URL } }
            - name: DB_SSLMODE
              valueFrom: { configMapKeyRef: { name: vacation-config, key: DB_SSLMODE, optional: true } }
            - name: DB_SSLROOTCERT
              valueFrom: { configMapKeyRef: { name: vacation-config, key: DB_SSLROOTCERT, optional: true } }
            - name: BACKUP_AGE_RECIPIENTS
              valueFrom: { configMapKeyRef: { name: vacation-config, key: BACKUP_AGE_RECIPIENTS } }
          envFrom:
            - secretRef: { name: vacation-backup }
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: db-ca, mountPath: /app/certs, readOnly: true }
