# Образец секрета. НЕ коммитить с настоящими значениями.
# Создать: скопировать, заполнить и выполнить
#   kubectl -n vacation apply -f secret.yaml
# или: kubectl -n vacation create secret generic vacation-secrets --from-env-file=.env.k8s
apiVersion: v1
kind: Secret
metadata:
  name: vacation-secrets
type: Opaque
stringData:
  SECRET_KEY: "замените-на-случайную-строку-от-50-символов"
  DATABASE_URL: "postgres://vacation:ПАРОЛЬ@postgres.example.com:5432/vacation"
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  # Прежние ключи при смене SECRET_KEY (через запятую); пусто — смены нет.
  SECRET_KEY_FALLBACKS: ""
---
# Первый администратор (docs/14-initial-admin.md). Отдельный секрет:
# подключается только к Job миграций, в веб-подах пароля нет.
# После первого входа — удалить: kubectl -n vacation delete secret vacation-admin
apiVersion: v1
kind: Secret
metadata:
  name: vacation-admin
type: Opaque
stringData:
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
