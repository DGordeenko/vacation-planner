services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacation}
      POSTGRES_USER: ${POSTGRES_USER:-vacation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacation}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Бэкенд стартует только после готовности базы, иначе первая же
      # миграция упадёт на ещё не поднятом сервере.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-replace-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-vacation}:${POSTGRES_PASSWORD:-vacation}@postgres:5432/${POSTGRES_DB:-vacation}
      PORT: 8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-False}
      APP_BASE_URL: ${APP_BASE_URL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      MAIL_SCHEDULER: ${MAIL_SCHEDULER:-1}
      # Первый администратор, см. docs/14-initial-admin.md
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      ADMIN_EMPLOYEE_NUMBER: ${ADMIN_EMPLOYEE_NUMBER:-}
      ADMIN_HIRE_DATE: ${ADMIN_HIRE_DATE:-}
      # Демо-режим, см. docs/15-demo-mode.md
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-False}
      DEMO_DATABASE_URL: ${DEMO_DATABASE_URL:-}
      DEMO_LOAD_ON_START: ${DEMO_LOAD_ON_START:-1}
      DEMO_RESET_DAILY: ${DEMO_RESET_DAILY:-1}
      DEMO_RESET_TIME: ${DEMO_RESET_TIME:-00:00}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # С демо-режимом старт дольше: данные загружаются заново (~15 с)
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # Пусто: обращение к API идёт относительным путём, nginx проксирует.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Резервные копии базы: pg_dump раз в сутки в ./backups на хосте,
  # хранение 14 дней. Восстановление — docs/16-backups.md.
  # Тот же образ, что у базы: версия pg_dump совпадает с версией сервера.
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/pg-backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-vacation}
      PGUSER: ${POSTGRES_USER:-vacation}
      PGPASSWORD: ${POSTGRES_PASSWORD:-vacation}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./deploy/backup/pg-backup.sh:/pg-backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
