server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # SPA: любой маршрут отдаёт index.html, маршрутизация на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование на бэкенд: фронтенд и API живут на одном домене,
    # поэтому CORS не нужен. Для площадок с разными доменами
    # используется VITE_API_BASE_URL, и этот блок не задействуется.
    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass ${BACKEND_URL};
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
